name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://auction_ng:auction_ng_ci@localhost:5432/auction_ng
      MEILISEARCH_URL: http://localhost:7700
      MEILI_MASTER_KEY: auction-ng-ci-search-key
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 8025:8025
        env:
          MP_DISABLE_VERSION_CHECK: 'true'
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      meilisearch:
        image: getmeili/meilisearch:v1.23.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: auction-ng-ci-search-key
          MEILI_NO_ANALYTICS: 'true'
          MEILI_MAX_INDEXING_THREADS: '2'
          MEILI_MAX_INDEXING_MEMORY: 256MiB
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: auction_ng
          POSTGRES_PASSWORD: auction_ng_ci
          POSTGRES_DB: auction_ng
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction_ng -d auction_ng"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET appendonly yes appendfsync always maxmemory-policy noeviction
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: test-results/
