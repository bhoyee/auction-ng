name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: deploy-vps
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          # Public host key of the VPS (not secret); pins the server.
          # SHA256:LpE+HgCM1rrZph3k6Ik/krBIUVePEoSj+DVxmM0eiN8
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFPc7lqEb7eIvhubYAT+ahNS6pFCzoXtZhR9XiueQZcH
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "Invalid ref"; exit 2; }
          HOST=$(printf '%s' "$HOST" | tr -d '\r\n ')
          install -m 700 -d ~/.ssh
          # Secrets pasted from Windows may carry CRLF line endings.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          # The server pins this key to infra/deploy/ci-deploy.sh (forced command).
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$HOST" "deploy $REF"
