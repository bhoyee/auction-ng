name: Deploy staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: true
        default: staging
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ secrets.STAGING_HOST }}
          REF: ${{ inputs.ref || 'staging' }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "Invalid ref"; exit 2; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          # The server pins this key to infra/deploy/ci-deploy.sh (forced command).
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$HOST" "deploy $REF"
