name: auction-ng
x-local-app: &local-app
  image: auction-ng-local
  build:
    context: .
    dockerfile: infra/docker/local.Dockerfile
    args:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:4001}
  init: true
  restart: unless-stopped
  healthcheck: &http-health
    test: ['CMD', 'node', 'scripts/check-http.mjs', 'http://127.0.0.1:3000']
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
services:
  web:
    <<: *local-app
    command: ['pnpm', '--filter', 'web', 'start']
    environment:
      API_INTERNAL_URL: http://api:4000
      SUPPORT_WHATSAPP_NUMBER: ${SUPPORT_WHATSAPP_NUMBER:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-info@auctionng.com}
      SOCIAL_X_URL: ${SOCIAL_X_URL:-}
      SOCIAL_FACEBOOK_URL: ${SOCIAL_FACEBOOK_URL:-}
      SOCIAL_INSTAGRAM_URL: ${SOCIAL_INSTAGRAM_URL:-}
      SOCIAL_TIKTOK_URL: ${SOCIAL_TIKTOK_URL:-}
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3300}:3000'
  admin:
    <<: *local-app
    command: ['pnpm', '--filter', 'admin', 'start']
    ports:
      - '127.0.0.1:${ADMIN_HOST_PORT:-3301}:3001'
    healthcheck:
      <<: *http-health
      test: ['CMD', 'node', 'scripts/check-http.mjs', 'http://127.0.0.1:3001']
  api:
    <<: *local-app
    command: ['pnpm', '--filter', 'api', 'start']
    environment:
      API_PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-auction_ng}:${POSTGRES_PASSWORD:-auction_ng_local}@postgres:5432/${POSTGRES_DB:-auction_ng}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      PII_HASH_KEY: ${PII_HASH_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      RECONCILIATION_TOKEN: ${RECONCILIATION_TOKEN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_UPLOAD_BUCKET: ${R2_UPLOAD_BUCKET:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-auction-ng-local-search-key}
      MEILISEARCH_INDEX: ${MEILISEARCH_INDEX:-auction_ng_open_lots_v1}
      SEARCH_SYNC_TOKEN: ${SEARCH_SYNC_TOKEN:-}
      REDIS_URL: redis://redis:6379
      BIDS_ENABLED: ${BIDS_ENABLED:-false}
      BID_PREPARATION_MS: ${BID_PREPARATION_MS:-60000}
      BID_MAINTENANCE_TOKEN: ${BID_MAINTENANCE_TOKEN:-}
      AUTH_MODE: ${AUTH_MODE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-TLS}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Auction NG}
      MAILPIT_URL: http://mailpit:8025
      AUTH_WEB_ORIGINS: ${AUTH_WEB_ORIGINS:-http://localhost:3300,http://localhost:3301}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    healthcheck:
      <<: *http-health
      test:
        [
          'CMD',
          'node',
          'scripts/check-http.mjs',
          'http://127.0.0.1:4000/health',
        ]
  realtime:
    <<: *local-app
    command: ['pnpm', '--filter', 'realtime', 'start']
    environment:
      REALTIME_PORT: '4001'
      INTERNAL_API_URL: http://api:4000
      REALTIME_WEB_ORIGINS: ${REALTIME_WEB_ORIGINS:-http://localhost:3300,http://localhost:3301}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${REALTIME_HOST_PORT:-4001}:4001'
    healthcheck:
      <<: *http-health
      test:
        [
          'CMD',
          'node',
          'scripts/check-http.mjs',
          'http://127.0.0.1:4001/health',
        ]
  worker:
    <<: *local-app
    command: ['pnpm', '--filter', 'worker', 'start']
    environment:
      REDIS_URL: redis://redis:6379
      INTERNAL_API_URL: http://api:4000
      RECONCILIATION_TOKEN: ${RECONCILIATION_TOKEN:-}
      SEARCH_SYNC_TOKEN: ${SEARCH_SYNC_TOKEN:-}
      BIDS_ENABLED: ${BIDS_ENABLED:-false}
      BID_MAINTENANCE_TOKEN: ${BID_MAINTENANCE_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *http-health
      test: ['CMD', 'node', 'scripts/check-worker.mjs']
  postgres:
    image: postgres:16.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auction_ng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction_ng_local}
      POSTGRES_DB: ${POSTGRES_DB:-auction_ng}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'always',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
    environment:
      MP_MAX_MESSAGES: '500'
      MP_DISABLE_VERSION_CHECK: 'true'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
  meilisearch:
    image: getmeili/meilisearch:v1.23.0
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-auction-ng-local-search-key}
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-2}
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-256MiB}
    ports:
      - '127.0.0.1:7700:7700'
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
